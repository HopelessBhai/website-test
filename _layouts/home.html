---
layout: base
---
<div class="flex justify-center py-8">
  {{content}}
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Check if the user is on a phone
    const isPhone = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (isPhone) {
      // Create the pop-up block
      const popup = document.createElement("div");
      popup.id = "phone-warning-popup";
      popup.innerHTML = `
        <div id="popup-content">
          <p>Warning: This site is not optimized for phone viewing!</p>
          <button id="close-popup">Close</button>
        </div>
      `;
      document.body.appendChild(popup);

      // Style the pop-up
      const style = document.createElement("style");
      style.innerHTML = `
        #phone-warning-popup {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.8);
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 1000;
        }
        #popup-content {
          background-color: white;
          padding: 20px;
          border-radius: 10px;
          text-align: center;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        #popup-content p {
          margin: 0 0 10px;
        }
        #popup-content button {
          padding: 10px 20px;
          background-color: #007bff;
          color: white;
          border: none;
          border-radius: 5px;
          cursor: pointer;
        }
        #popup-content button:hover {
          background-color: #0056b3;
        }
      `;
      document.head.appendChild(style);

      // Add functionality to close the pop-up
      document.getElementById("close-popup").addEventListener("click", function () {
        popup.style.display = "none";
      });
    }
  });
</script>


<div style="width: 80%; margin: auto; gap: 24px; columns: 2; column-gap: 24px; margin-bottom: 40px;">
  {% for post in site.posts %}
  <div style="padding-bottom: 32px; margin-bottom: 32px; break-inside: avoid;">
    <div style="transition: all 0.3s ease-in-out; transform-origin: center;">
      <a href="{{ post.url | relative_url }}" 
         style="text-decoration: none; transition: all 0.3s ease-in-out; display: block;">
        <img src="{{ post.image | relative_url }}" alt="" 
             style="width: 100%; max-width: 640px; height: auto; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); transition: transform 0.3s ease-in-out;">
        <h2 style="font-size: 1.25rem; padding-top: 20px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
          {{ post.title }}
        </h2>
      </a>
    </div>

    <div style="padding-top: 4px;">
      {% for tag in post.tags limit:3 %}
      <span style="font-size: 0.75rem; color: var(--text-color);; vertical-align: text-top;">#{{ tag }}</span>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</div>

<style>
  a:hover img {
    transform: scale(1.05);
  }
  a img {
    transform: scale(1);
    transition: transform 0.3s ease-in-out;
  }
</style>
